<ul>
  {% for item in site.menu %}
    {% if item.title and item.url %}
      <li>
        {% if item.url contains '://' %}
          <a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.title }}</a>
        {% else %}
          <a href="{{ site.url }}{{ site.baseurl }}{{ item.url }}">{{ item.title }}</a>
        {% endif %}
      </li>
    {% endif %}
  {% endfor %}
</ul>
