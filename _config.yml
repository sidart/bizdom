# Site Settings
name: TheBizdom
title: TheBizdom | BIZ of the wisDOM
description: Stories from Indian business history — the brands, business houses,
  markets, and people that shaped modern India. We are in the BIZness of spreading
  wisDOM.
tags:
  - Indian Business History
  - Modern India
  - Data Story
  - Startups
  - Fintech
show_hero: true
paginate: 12
menu:
  - title: Home
    url: /
  - title: About
    url: /about
  - title: Contact
    url: /contact
  - title: Newsletter
    url: /newsletter



# Social Media Settings
# Remove the item if you don't need it
# (all social links removed — see footer.html for project links instead)



# Posts Settings
show_time_bar: true
show_modal_on_exit: false
show_modal_on_finish_post: false
two_columns_layout: true


# Advanced Settings
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.thebizdom.in" # the base hostname and protocol for your site
# GA4 measurement ID (G-XXXXXXXXXX). The old Universal Analytics (UA-) ID was
# sunset by Google in 2023 and no longer collects data.
google_analytics: ""
language: "en"
categories_folder: category
sent_message_url: "/contact/message-sent/"


# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
collections:
  authors:
    output: true
paginate_path: "/page/:num/"
show_get_theme_btn: false
use_logo: false

# Content paginator
paginate_content:
  enabled: true
  debug: false
  collections:
    - posts
  auto: false
  separator: "--page-break--"
  permalink: "/:num/"
  seo_canonical: true
  properties:
    part:
      is_generated: true
    last:
      is_generated: true
    single:
      is_generated: true

# SASS
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-admin
  - jekyll-paginate
  - jekyll-paginate-content

# Exclude my node related stuff
exclude: [
  'package.json',
  'package-lock.json',
  'src',
  'node_modules',
  'initpost.sh',
  'Gemfile',
  'Gemfile.lock',
  'gulpfile.js',
  'README.md'
]

# Theme
version: v3.2.0
